# Example catalog. Do not assume commands here install tools yet.
# Live catalog will be /etc/bioenv/tools.yaml.
settings:
  envs_root: /opt/bioinformatics/envs
  bin_dir: /usr/local/bin
  micromamba: /usr/local/bin/micromamba
  mamba_root: /opt/bioinformatics
  databases_root: /mnt/2TB_HD/Databases

tools:
  bakta:
    package: bakta
    categories:
      - amr
    version: "1.12.1"
    python: "3.12"
    commands:
      - bakta
      - bakta_db
    databases:
      - name: full
        path: bakta/db
        env: BAKTA_DB
        required: true

  spades:
    package: spades
    categories:
      - assembly
    commands:
      spades: spades.py
      spades.py: spades.py

  kraken2:
    package: kraken2
    categories:
      - classification
    commands:
      - kraken2
      - kraken2-build
      - kraken2-inspect
    databases:
      - name: standard
        path: kraken2/standard
        env: KRAKEN2_DB
        required: false
